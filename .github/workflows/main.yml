name: Build mods
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Build (arm64-v8a)
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"
          xmake -y
      - name: Copiar el .levipack
        run: |
          mkdir -p out
          for n in SodiumLevi XrayLevi; do cp "$(find build -name $n.levipack | head -n 1)" out/$n.levipack; done
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mods erickzgcs (ultima version)
          make_latest: true
          files: |
            out/SodiumLevi.levipack
            out/XrayLevi.levipack
            
